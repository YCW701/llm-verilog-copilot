[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "verilog-copilot"
version = "0.1.0"
description = "LLM Copilot for Verilog Design -- Rutgers ECE Capstone Group 62 (M1: offline verification harness)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # runtime uses the standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
verilog-copilot = "verilog_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: requires real Icarus Verilog tools (iverilog, vvp); skipped when absent",
]
